<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Documentation</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            line-height: 1.6;
            min-height: 100vh;
        }

        .back-link {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(16, 185, 129, 0.3);
            padding: 12px 20px;
        }

        .back-link a {
            color: #10b981;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: color 0.2s;
        }

        .back-link a:hover {
            color: #34d399;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        #content {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 12px;
            padding: 40px;
        }

        #content h1 {
            color: #10b981;
            margin-bottom: 24px;
            font-size: 2.5rem;
        }

        #content h2 {
            color: #34d399;
            margin-top: 32px;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(16, 185, 129, 0.3);
        }

        #content h3 {
            color: #6ee7b7;
            margin-top: 24px;
            margin-bottom: 12px;
        }

        #content h4 {
            color: #a7f3d0;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        #content code {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(71, 85, 105, 0.5);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            color: #fbbf24;
            font-size: 0.9em;
        }

        #content pre {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(71, 85, 105, 0.5);
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            margin: 16px 0;
        }

        #content pre code {
            background: none;
            border: none;
            padding: 0;
            color: #e2e8f0;
        }

        #content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            overflow: hidden;
        }

        #content th {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid rgba(16, 185, 129, 0.5);
        }

        #content td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(71, 85, 105, 0.3);
        }

        #content tr:hover {
            background: rgba(16, 185, 129, 0.05);
        }

        #content a {
            color: #60a5fa;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        #content a:hover {
            border-bottom-color: #60a5fa;
        }

        #content blockquote {
            border-left: 4px solid #10b981;
            padding-left: 20px;
            margin: 20px 0;
            color: #94a3b8;
            font-style: italic;
        }

        #content ul, #content ol {
            margin-left: 24px;
            margin-bottom: 16px;
        }

        #content li {
            margin-bottom: 8px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="back-link">
        <a href="/pcloud-tools/dashboard/index.html">
            <span style="font-size: 1.2em;">←</span>
            <span>Zurück zum Dashboard</span>
        </a>
    </div>

    <div class="container">
        <div id="content" class="loading">
            Lade Dokumentation...
        </div>
    </div>

    <script>
        async function loadMarkdown() {
            try {
                const response = await fetch('DASHBOARD.md');
                const markdown = await response.text();
                const html = marked.parse(markdown);
                document.getElementById('content').innerHTML = html;
            } catch (error) {
                document.getElementById('content').innerHTML = 
                    '<h1 style="color: #ef4444;">Fehler beim Laden</h1>' +
                    '<p>Die Dokumentation konnte nicht geladen werden: ' + error.message + '</p>';
            }
        }

        loadMarkdown();
    </script>
</body>
</html>
