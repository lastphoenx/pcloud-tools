<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backup & Monitoring Dashboard</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green:   #22c55e;
      --yellow:  #f59e0b;
      --red:     #ef4444;
      --blue:    #3b82f6;
      --gray:    #6b7280;
      --bg:      #0a0e1a;
      --surface: #1e293b;
      --surface2:#273549;
      --border:  #334155;
      --text:    #e2e8f0;
      --muted:   #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .header .meta { font-size: 13px; color: var(--muted); text-align: right; }
    .header .meta span { display: block; }
    .header .meta .tz-hint { font-size: 11px; opacity: 0.85; }

    .overall-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .overall-dot {
      width: 18px; height: 18px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--gray);
    }
    .overall-dot.ok       { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .overall-dot.warning  { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
    .overall-dot.critical { background: var(--red);   box-shadow: 0 0 8px var(--red); }
    .overall-dot.running  { background: var(--blue);  box-shadow: 0 0 8px var(--blue); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    .overall-label { font-size: 16px; font-weight: 600; }
    .overall-explain { font-size: 13px; color: var(--muted); }

    .tiles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 1000px) { .tiles { grid-template-columns: 1fr; } }
    @media (min-width: 1001px) and (max-width: 1280px) { .tiles { grid-template-columns: 1fr 1fr; } }

    .tile {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .tile-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }
    .tile-icon { font-size: 20px; }
    .tile-title { font-size: 16px; font-weight: 600; flex: 1; }
    .tile-status-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--gray);
    }
    .tile-status-dot.ok      { background: var(--green); }
    .tile-status-dot.warning { background: var(--yellow); }
    .tile-status-dot.bad     { background: var(--red); }
    .tile-status-dot.running { background: var(--blue); animation: pulse 1.5s infinite; }

    .tile-body { padding: 16px 20px; flex: 1; display: flex; flex-direction: column; gap: 10px; }

    .summary-row {
      display: flex;
      gap: 12px;
      margin-bottom: 4px;
    }
    .summary-box {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      text-align: center;
    }
    .summary-box .big { font-size: 26px; font-weight: 700; line-height: 1; }
    .summary-box .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .summary-box.green .big  { color: var(--green); }
    .summary-box.yellow .big { color: var(--yellow); }
    .summary-box.red .big    { color: var(--red); }
    .summary-box.blue .big   { color: var(--blue); }
    .summary-box.gray .big   { color: var(--muted); }

    .summary-row-secondary { margin-top: -2px; }
    .summary-row-secondary .summary-box {
      padding: 8px 10px;
      opacity: 0.85;
    }
    .summary-row-secondary .summary-box .big { font-size: 18px; }
    .summary-row-secondary .summary-box .lbl { font-size: 10px; }
    .summary-box.clickable {
      cursor: pointer;
      transition: border-color 0.15s, opacity 0.15s;
    }
    .summary-box.clickable:hover {
      border-color: var(--blue);
      opacity: 1;
    }
    tr.integrity-row-dim { opacity: 0.35; }
    tr.integrity-row-hit { background: rgba(96, 165, 250, 0.08); }

    .integrity-hint {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.45;
      padding: 8px 10px;
      background: var(--surface2);
      border-radius: 8px;
      border-left: 3px solid var(--border);
    }
    .integrity-hint strong { color: var(--text); font-weight: 600; }

    .scan-mini-table {
      width: 100%;
      font-size: 11px;
      border-collapse: collapse;
    }
    .scan-mini-table th,
    .scan-mini-table td {
      padding: 5px 8px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .scan-mini-table th {
      color: var(--muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-size: 10px;
    }

    .info-group { display: flex; flex-direction: column; gap: 6px; }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 7px 10px;
      background: var(--surface2);
      border-radius: 8px;
      font-size: 13px;
      gap: 8px;
    }
    .info-row .lbl { color: var(--muted); flex-shrink: 0; }
    .info-row .val { font-weight: 500; text-align: right; word-break: break-word; max-width: 65%; }
    .info-row .val.green  { color: var(--green); }
    .info-row .val.yellow { color: var(--yellow); }
    .info-row .val.red    { color: var(--red); }
    .info-row .val.blue   { color: var(--blue); }

    .rtb-delta-details {
      margin-top: 4px;
      padding: 8px 10px;
      background: var(--surface2);
      border-radius: 8px;
      font-size: 12px;
      border-left: 3px solid var(--yellow);
    }
    .rtb-delta-details summary {
      cursor: pointer;
      color: var(--yellow);
      font-weight: 500;
      list-style: none;
    }
    .rtb-delta-details summary::-webkit-details-marker { display: none; }
    .rtb-delta-details summary::before {
      content: '\25B6 ';
      font-size: 10px;
      opacity: 0.8;
    }
    .rtb-delta-details[open] summary::before { content: '\25BC '; }
    .rtb-delta-details .muted { color: var(--muted); font-weight: 400; }
    .rtb-delta-lines {
      margin-top: 8px;
      padding: 8px;
      background: var(--bg);
      border-radius: 6px;
      font-family: ui-monospace, 'Cascadia Code', 'Consolas', monospace;
      font-size: 11px;
      line-height: 1.45;
      word-break: break-all;
      max-height: 280px;
      overflow-y: auto;
    }

    .rtb-policy-details {
      margin-top: 6px;
      padding: 8px 10px;
      background: var(--surface2);
      border-radius: 8px;
      font-size: 12px;
      border-left: 3px solid var(--blue);
    }
    .rtb-policy-details.scope { border-left-color: var(--muted); }
    .rtb-policy-details summary {
      cursor: pointer;
      font-weight: 500;
      list-style: none;
      color: var(--text);
    }
    .rtb-policy-details summary::-webkit-details-marker { display: none; }
    .rtb-policy-details summary::before {
      content: '\25B6 ';
      font-size: 10px;
      opacity: 0.8;
    }
    .rtb-policy-details[open] summary::before { content: '\25BC '; }
    .rtb-policy-table {
      width: 100%;
      margin-top: 8px;
      border-collapse: collapse;
      font-size: 11px;
    }
    .rtb-policy-table th,
    .rtb-policy-table td {
      text-align: left;
      padding: 4px 6px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    .rtb-policy-table th { color: var(--muted); font-weight: 500; }
    .rtb-policy-table code {
      font-family: ui-monospace, 'Cascadia Code', 'Consolas', monospace;
      font-size: 10px;
    }
    .rtb-policy-table .pol-nein { color: var(--muted); }
    .rtb-policy-table .pol-mit { color: var(--blue); }
    .rtb-policy-table .pol-nie { color: var(--yellow); }
    .rtb-policy-hint {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }

    .service-list { display: flex; flex-direction: column; gap: 5px; }
    .service-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      background: var(--surface2);
      border-radius: 8px;
      font-size: 13px;
    }
    .svc-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .svc-dot.active   { background: var(--green); }
    .svc-dot.success  { background: var(--green); }
    .svc-dot.inactive { background: var(--gray); }
    .svc-dot.failed   { background: var(--red); }
    .svc-dot.stalled  { background: var(--red); animation: pulse 1.5s infinite; }
    .svc-dot.blocked  { background: var(--yellow); }
    .svc-dot.skipped  { background: var(--yellow); }
    .svc-dot.running  { background: var(--blue); animation: pulse 1.5s infinite; }
    .svc-dot.unknown  { background: var(--gray); }
    /* Color-based classes for detail cards */
    .svc-dot.green    { background: var(--green); }
    .svc-dot.yellow   { background: var(--yellow); }
    .svc-dot.red      { background: var(--red); }
    .svc-dot.blue     { background: var(--blue); }
    .svc-dot.gray     { background: var(--gray); }
    .svc-name { flex: 1; color: var(--text); }
    .svc-detail { font-size: 11px; color: var(--muted); }

    .tile-detail {
      border-top: 1px solid var(--border);
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .tile-detail.open { max-height: 600px; }
    .tile-detail-inner { 
      padding: 16px 20px; 
      max-height: 550px;
      overflow-x: auto; 
      overflow-y: auto;
      /* Horizontal + vertical scrolling for large tables */ 
    }
    .detail-toggle {
      background: none; border: none; cursor: pointer;
      width: 100%;
      padding: 10px 20px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .detail-toggle:hover { color: var(--text); }
    .detail-toggle .arrow { transition: transform 0.3s; }
    .detail-toggle.open .arrow { transform: rotate(180deg); }

    .report-table {
      width: 100%;
      min-width: 600px; /* Ensure scrolling activates for narrow viewports */
      border-collapse: collapse;
      font-size: 12px;
    }
    .report-table th {
      text-align: left;
      color: var(--muted);
      font-weight: 500;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-size: 11px;
    }
    .report-table td {
      padding: 7px 8px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
    }
    .report-table tr:last-child td { border-bottom: none; }
    .report-table tr:hover td { background: rgba(255,255,255,0.03); }
    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge.success { background: rgba(34,197,94,0.15);  color: var(--green); }
    .badge.failed  { background: rgba(239,68,68,0.15);  color: var(--red); }
    .badge.running { background: rgba(59,130,246,0.15); color: var(--blue); }
    .badge.nas     { background: rgba(168,85,247,0.15); color: #a855f7; }
    .badge.os      { background: rgba(59,130,246,0.15); color: var(--blue); }

    .footer {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      padding: 10px 4px;
    }

    .loading-overlay {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      padding: 40px;
      gap: 10px;
    }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err-box {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px;
      padding: 16px;
      color: #fca5a5;
      font-size: 13px;
      margin: 8px 0;
    }

    /* ── Detail Sections ── */
    .detail-section { margin-top: 28px; }
    .section-heading {
      font-size: 12px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.8px;
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    }
    .section-heading::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .dcard {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .dcard-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      font-size: 14px; font-weight: 600;
    }
    .dcard-body { 
      padding: 4px 16px 10px; 
      overflow-x: auto; 
      /* Horizontal scrolling for wide tables */ 
    }
    .dcard-row {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 7px 0; border-bottom: 1px solid rgba(51,65,85,0.5);
      font-size: 13px; gap: 12px;
    }
    .dcard-row:last-child { border-bottom: none; }
    .dcard-lbl { color: var(--muted); flex-shrink: 0; }
    .dcard-val { font-weight: 500; text-align: right; word-break: break-word; max-width: 80%; }
    .dcard-val.green  { color: var(--green); }
    .dcard-val.yellow { color: var(--yellow); }
    .dcard-val.red    { color: var(--red); }
    .dcard-val.blue   { color: var(--blue); }

    /* Documentation Navigation */
    .docs-nav {
      padding: 12px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .docs-nav .nav-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }
    .docs-nav .nav-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .docs-nav .nav-link {
      font-size: 13px;
      padding: 6px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .docs-nav .nav-link:hover {
      background: rgba(16, 185, 129, 0.1);
      border-color: var(--green);
      color: var(--green);
      transform: translateY(-1px);
    }
  </style>
</head>
